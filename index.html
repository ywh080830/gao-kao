<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>高考录取数据云端</title>

<body>
  <h1>高考模拟填报系统 — 云端数据</h1>
  <p>本目录为「高考模拟填报系统」EXE 按省懒加载所用的公开数据集（完全免费托管）。</p>
  <ul>
    <li><code>data/schools.csv</code> — 全国院校库</li>
    <li><code>data/admission/&lt;省份&gt;.csv</code> — 各省院校投档线</li>
    <li><code>data/rank_tables/&lt;省份&gt;.csv</code> — 各省一分一段表</li>
    <li><code>version.json</code> — 各文件 sha256 / 行数（供更新检查）</li>
  </ul>
  <p>数据来源于公开教育考试院 / 阳光高考 / 公开数据集，仅供学习模拟，请以官方发布为准。</p>
</body>
</html>
